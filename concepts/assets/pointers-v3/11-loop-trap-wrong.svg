<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#fee2e2"/></linearGradient>
    <linearGradient id="redBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="grayBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3a2f22" flood-opacity="0.16"/></filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1000" height="400" rx="24" fill="url(#bg)"/>
  <text x="500" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#7f1d1d">❌ WRONG — one shared mailbox</text>
  <text x="500" y="68" text-anchor="middle" font-size="13" fill="#991b1b" font-family="monospace">for i := 0; i &lt; 3; i++ { result = append(result, &amp;i) }</text>

  <g filter="url(#shadow)"><rect x="400" y="100" width="200" height="110" rx="16" fill="url(#redBox)" stroke="#b91c1c" stroke-width="3"/></g>
  <text x="500" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">i  (0xc0001)</text>
  <text x="500" y="165" text-anchor="middle" font-size="15" fill="#7f1d1d">reused every lap:</text>
  <text x="500" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">0 → 1 → 2 → 3</text>

  <g filter="url(#shadow)"><rect x="90" y="270" width="220" height="85" rx="14" fill="url(#grayBox)" stroke="#78716c" stroke-width="2.5"/></g>
  <text x="200" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#44403c">result[0]</text>
  <g filter="url(#shadow)"><rect x="390" y="270" width="220" height="85" rx="14" fill="url(#grayBox)" stroke="#78716c" stroke-width="2.5"/></g>
  <text x="500" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#44403c">result[1]</text>
  <g filter="url(#shadow)"><rect x="690" y="270" width="220" height="85" rx="14" fill="url(#grayBox)" stroke="#78716c" stroke-width="2.5"/></g>
  <text x="800" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#44403c">result[2]</text>

  <path d="M 200 270 C 250 240, 420 200, 460 210" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <path d="M 500 270 L 500 212" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <path d="M 800 270 C 750 240, 580 200, 542 210" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <text x="500" y="385" text-anchor="middle" font-size="15" fill="#7f1d1d" font-weight="700">All three dereference to 3 — the loop's final value of i</text>
</svg>
