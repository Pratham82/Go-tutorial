<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#fef3e2"/></linearGradient>
    <linearGradient id="ptrBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6cc"/><stop offset="1" stop-color="#ffd0a3"/></linearGradient>
    <linearGradient id="varBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0ecff"/><stop offset="1" stop-color="#c7dbff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3a2f22" flood-opacity="0.16"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1000" height="380" rx="24" fill="url(#bg)"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#3a2f22">A slice is a small "remote control" for an array</text>

  <!-- header/remote -->
  <g filter="url(#shadow)"><rect x="70" y="100" width="240" height="200" rx="20" fill="url(#ptrBox)" stroke="#c2410c" stroke-width="3"/></g>
  <text x="190" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">slice header</text>
  <rect x="95" y="150" width="190" height="36" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="190" y="173" text-anchor="middle" font-size="14" fill="#7c2d12" font-weight="600">ptr → underlying array</text>
  <rect x="95" y="196" width="190" height="36" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="190" y="219" text-anchor="middle" font-size="14" fill="#7c2d12" font-weight="600">len = 3</text>
  <rect x="95" y="242" width="190" height="36" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="190" y="265" text-anchor="middle" font-size="14" fill="#7c2d12" font-weight="600">cap = 3</text>

  <path d="M 315 168 C 400 168, 400 200, 470 200" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- underlying array -->
  <g filter="url(#shadow)"><rect x="480" y="170" width="90" height="90" rx="12" fill="url(#varBox)" stroke="#1d4ed8" stroke-width="2.5"/></g>
  <text x="525" y="222" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">1</text>
  <g filter="url(#shadow)"><rect x="580" y="170" width="90" height="90" rx="12" fill="url(#varBox)" stroke="#1d4ed8" stroke-width="2.5"/></g>
  <text x="625" y="222" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">2</text>
  <g filter="url(#shadow)"><rect x="680" y="170" width="90" height="90" rx="12" fill="url(#varBox)" stroke="#1d4ed8" stroke-width="2.5"/></g>
  <text x="725" y="222" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">3</text>
  <rect x="780" y="170" width="90" height="90" rx="12" fill="#f5f5f4" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="825" y="222" text-anchor="middle" font-size="15" fill="#a8a29e">spare</text>
  <text x="675" y="290" text-anchor="middle" font-size="13" fill="#57534e">underlying array — shared until capacity is exceeded</text>

  <text x="500" y="335" text-anchor="middle" font-size="14.5" fill="#57534e">Editing s[0] is visible to the caller (shared array). Appending past cap allocates a</text>
  <text x="500" y="358" text-anchor="middle" font-size="14.5" fill="#57534e" font-weight="600">NEW array — that's why append()'s result must be reassigned.</text>
</svg>
