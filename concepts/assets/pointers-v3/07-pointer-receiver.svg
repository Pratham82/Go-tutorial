<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 420" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#fef3e2"/></linearGradient>
    <linearGradient id="varBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0ecff"/><stop offset="1" stop-color="#c7dbff"/></linearGradient>
    <linearGradient id="grayBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="greenBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3a2f22" flood-opacity="0.16"/></filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
  </defs>
  <rect width="1050" height="420" rx="24" fill="url(#bg)"/>
  <text x="525" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#3a2f22">Counter — value receiver vs. pointer receiver</text>

  <g filter="url(#shadow)"><rect x="60" y="90" width="200" height="110" rx="16" fill="url(#varBox)" stroke="#1d4ed8" stroke-width="3"/></g>
  <text x="160" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">c := Counter</text>
  <text x="160" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">count = 0</text>
  <text x="160" y="182" text-anchor="middle" font-size="12" fill="#1e40af">the ONE real Counter</text>

  <!-- value receiver path -->
  <path d="M270 130 C 340 100, 390 100, 430 110" fill="none" stroke="#78716c" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <text x="350" y="90" text-anchor="middle" font-size="13" fill="#57534e" font-weight="600">c.IncWrong()</text>
  <g filter="url(#shadow)"><rect x="440" y="70" width="230" height="90" rx="14" fill="url(#grayBox)" stroke="#78716c" stroke-width="2.5" stroke-dasharray="6 5"/></g>
  <text x="555" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#44403c">value receiver → COPY</text>
  <text x="555" y="126" text-anchor="middle" font-size="14" fill="#44403c">copy.count = 1</text>
  <text x="555" y="146" text-anchor="middle" font-size="11" fill="#a8a29e" font-style="italic">discarded</text>
  <path d="M440 130 C 380 150, 320 150, 272 140" fill="none" stroke="#78716c" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowGray)"/>
  <text x="350" y="168" text-anchor="middle" font-size="11" fill="#a8a29e" font-style="italic">c.count stays 0</text>

  <!-- pointer receiver path -->
  <path d="M270 170 C 340 210, 390 210, 430 210" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="350" y="235" text-anchor="middle" font-size="13" fill="#166534" font-weight="600">c.Inc()  (×2)</text>
  <g filter="url(#shadow)"><rect x="440" y="180" width="230" height="90" rx="14" fill="url(#greenBox)" stroke="#15803d" stroke-width="3"/></g>
  <text x="555" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">pointer receiver → SAME struct</text>
  <text x="555" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">c.count = 1, then 2 ✓</text>
  <text x="555" y="256" text-anchor="middle" font-size="11" fill="#166534" font-style="italic">persists</text>
  <path d="M440 220 C 380 200, 320 190, 272 175" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <text x="525" y="320" text-anchor="middle" font-size="15" fill="#57534e">Go auto-takes the address for pointer-receiver calls on addressable values —</text>
  <text x="525" y="345" text-anchor="middle" font-size="15" fill="#57534e" font-weight="600">that's why c.Inc() works even though c isn't written as &amp;c.</text>
</svg>
