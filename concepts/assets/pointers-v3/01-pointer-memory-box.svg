<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3e2"/>
    </linearGradient>
    <linearGradient id="varBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0ecff"/>
      <stop offset="1" stop-color="#c7dbff"/>
    </linearGradient>
    <linearGradient id="ptrBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6cc"/>
      <stop offset="1" stop-color="#ffd0a3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3a2f22" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="900" height="420" rx="24" fill="url(#bg)"/>
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#3a2f22">Memory — a row of numbered boxes</text>

  <!-- pointer box p -->
  <g filter="url(#shadow)">
    <rect x="90" y="120" width="260" height="180" rx="20" fill="url(#ptrBox)" stroke="#c2410c" stroke-width="2.5"/>
  </g>
  <rect x="110" y="100" width="110" height="34" rx="10" fill="#c2410c"/>
  <text x="165" y="123" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">0xc0002</text>
  <text x="220" y="185" text-anchor="middle" font-size="30" font-weight="700" fill="#7c2d12">p</text>
  <text x="220" y="220" text-anchor="middle" font-size="15" fill="#7c2d12">type: *int</text>
  <text x="220" y="255" text-anchor="middle" font-size="17" fill="#7c2d12" font-weight="600">holds → 0xc0001</text>
  <text x="220" y="280" font-size="13" fill="#9a3412" text-anchor="middle">"the pointer"</text>

  <!-- variable box x -->
  <g filter="url(#shadow)">
    <rect x="550" y="120" width="260" height="180" rx="20" fill="url(#varBox)" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <rect x="570" y="100" width="110" height="34" rx="10" fill="#1d4ed8"/>
  <text x="625" y="123" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">0xc0001</text>
  <text x="680" y="185" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a">x</text>
  <text x="680" y="220" text-anchor="middle" font-size="15" fill="#1e3a8a">type: int</text>
  <text x="680" y="255" text-anchor="middle" font-size="17" fill="#1e3a8a" font-weight="600">value = 42</text>
  <text x="680" y="280" font-size="13" fill="#1e40af" text-anchor="middle">"the data"</text>

  <!-- arrow -->
  <path d="M 360 210 C 440 150, 480 150, 545 210" fill="none" stroke="#c2410c" stroke-width="3.5" marker-end="url(#arrow)"/>
  <rect x="400" y="155" width="140" height="30" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="470" y="176" text-anchor="middle" font-size="14" fill="#9a3412" font-weight="600">points to</text>

  <text x="450" y="365" text-anchor="middle" font-size="16" fill="#57534e">p doesn't hold 42 — it holds the address of the box that holds 42.</text>
  <text x="450" y="392" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">The arrow *is* the pointer.</text>
</svg>
