<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#fef3e2"/></linearGradient>
    <linearGradient id="varBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0ecff"/><stop offset="1" stop-color="#c7dbff"/></linearGradient>
    <linearGradient id="ptrBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6cc"/><stop offset="1" stop-color="#ffd0a3"/></linearGradient>
    <linearGradient id="ptr2Box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3a2f22" flood-opacity="0.16"/></filter>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="950" height="320" rx="24" fill="url(#bg)"/>
  <text x="475" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#3a2f22">A chain: pp → p → x  (pointer to a pointer)</text>

  <g filter="url(#shadow)"><rect x="70" y="110" width="200" height="130" rx="16" fill="url(#ptr2Box)" stroke="#be185d" stroke-width="3"/></g>
  <text x="170" y="155" text-anchor="middle" font-size="26" font-weight="700" fill="#831843">pp</text>
  <text x="170" y="185" text-anchor="middle" font-size="13" fill="#831843">**int</text>
  <text x="170" y="210" text-anchor="middle" font-size="12" fill="#9d174d">holds address of p</text>

  <path d="M 275 175 L 355 175" stroke="#be185d" stroke-width="3" marker-end="url(#arrowPink)"/>

  <g filter="url(#shadow)"><rect x="360" y="110" width="200" height="130" rx="16" fill="url(#ptrBox)" stroke="#c2410c" stroke-width="3"/></g>
  <text x="460" y="155" text-anchor="middle" font-size="26" font-weight="700" fill="#7c2d12">p</text>
  <text x="460" y="185" text-anchor="middle" font-size="13" fill="#7c2d12">*int</text>
  <text x="460" y="210" text-anchor="middle" font-size="12" fill="#9a3412">holds address of x</text>

  <path d="M 565 175 L 645 175" stroke="#c2410c" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <g filter="url(#shadow)"><rect x="650" y="110" width="200" height="130" rx="16" fill="url(#varBox)" stroke="#1d4ed8" stroke-width="3"/></g>
  <text x="750" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">x</text>
  <text x="750" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">= 42</text>

  <text x="475" y="285" text-anchor="middle" font-size="15" fill="#57534e">**pp dereferences twice: pp → p, then p → x, giving 42</text>
</svg>
