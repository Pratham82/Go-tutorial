<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#fef3e2"/></linearGradient>
    <linearGradient id="varBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="ptrBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6cc"/><stop offset="1" stop-color="#ffd0a3"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3a2f22" flood-opacity="0.16"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1000" height="420" rx="24" fill="url(#bg)"/>
  <text x="500" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#3a2f22">double(&amp;x)  —  passing by POINTER</text>
  <text x="500" y="72" text-anchor="middle" font-size="14" fill="#78716c">like handing over the spare KEY to x's front door, not a copy of x</text>

  <!-- caller room -->
  <rect x="60" y="110" width="330" height="260" rx="20" fill="#fff" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="225" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#57534e">caller (main)</text>
  <g filter="url(#shadow)"><rect x="140" y="175" width="170" height="140" rx="16" fill="url(#varBox)" stroke="#15803d" stroke-width="3"/></g>
  <text x="225" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#14532d">x</text>
  <text x="225" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">5 → 10 ✓</text>
  <text x="225" y="290" text-anchor="middle" font-size="12" fill="#166534">0xc0001 — SAME box</text>

  <!-- key arrow -->
  <path d="M 400 240 C 470 240, 470 240, 540 240" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="470" y="220" text-anchor="middle" font-size="22">🔑</text>
  <text x="470" y="270" text-anchor="middle" font-size="12" fill="#9a3412">copies the address</text>

  <!-- function room -->
  <rect x="580" y="110" width="360" height="260" rx="20" fill="#fff" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="760" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#57534e">inside double(n *int)</text>
  <g filter="url(#shadow)"><rect x="675" y="175" width="170" height="140" rx="16" fill="url(#ptrBox)" stroke="#c2410c" stroke-width="2.5"/></g>
  <text x="760" y="225" text-anchor="middle" font-size="26" font-weight="700" fill="#7c2d12">n</text>
  <text x="760" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">→ 0xc0001</text>
  <text x="760" y="280" text-anchor="middle" font-size="12" fill="#9a3412">0xc0003 — own box,</text>
  <text x="760" y="298" text-anchor="middle" font-size="12" fill="#9a3412">but points BACK to x</text>

  <path d="M 675 245 C 500 340, 320 340, 230 320" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="450" y="360" text-anchor="middle" font-size="13" fill="#9a3412" font-style="italic">*n = *n * 2 writes straight back into x's box</text>

  <text x="500" y="400" text-anchor="middle" font-size="16" fill="#166534" font-weight="700">x is now 10 — the original box was updated</text>
</svg>
