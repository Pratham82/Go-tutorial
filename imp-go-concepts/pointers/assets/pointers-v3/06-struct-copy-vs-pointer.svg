<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 480" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#fef3e2"/></linearGradient>
    <linearGradient id="varBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0ecff"/><stop offset="1" stop-color="#c7dbff"/></linearGradient>
    <linearGradient id="grayBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="greenBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3a2f22" flood-opacity="0.16"/></filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1050" height="480" rx="24" fill="url(#bg)"/>
  <text x="525" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#3a2f22">Person struct — value vs. pointer methods</text>

  <!-- original -->
  <g filter="url(#shadow)"><rect x="400" y="85" width="250" height="150" rx="18" fill="url(#varBox)" stroke="#1d4ed8" stroke-width="3"/></g>
  <text x="525" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">person (original)</text>
  <text x="525" y="150" text-anchor="middle" font-size="15" fill="#1e3a8a">Name: Prathamesh</text>
  <text x="525" y="175" text-anchor="middle" font-size="15" fill="#1e3a8a">Age: 28</text>
  <text x="525" y="210" text-anchor="middle" font-size="12" fill="#1e40af">addr 0xc0001</text>

  <!-- left branch: birthday(person) copy -->
  <path d="M 460 240 C 380 290, 300 300, 260 330" fill="none" stroke="#78716c" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <text x="310" y="270" text-anchor="middle" font-size="13" fill="#57534e" font-weight="600">birthday(person)</text>
  <text x="310" y="288" text-anchor="middle" font-size="12" fill="#78716c">passes a COPY</text>
  <g filter="url(#shadow)"><rect x="90" y="335" width="270" height="110" rx="16" fill="url(#grayBox)" stroke="#78716c" stroke-width="2.5" stroke-dasharray="7 5"/></g>
  <text x="225" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#44403c">copy inside birthday()</text>
  <text x="225" y="392" text-anchor="middle" font-size="14" fill="#44403c">Age: 28 → 29</text>
  <text x="225" y="414" text-anchor="middle" font-size="12" fill="#a8a29e" font-style="italic">thrown away on return</text>

  <!-- right branch: birthdayPointer(&person) -->
  <path d="M 590 240 C 670 290, 750 300, 790 330" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="745" y="264" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="600">birthdayPointer(&amp;person)</text>
  <text x="745" y="282" text-anchor="middle" font-size="12" fill="#c2410c">passes the ADDRESS</text>
  <g filter="url(#shadow)"><rect x="690" y="335" width="270" height="110" rx="16" fill="url(#greenBox)" stroke="#15803d" stroke-width="3"/></g>
  <text x="825" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">p *Person = 0xc0001</text>
  <text x="825" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">(*p).Age++ ✓</text>
  <text x="825" y="414" text-anchor="middle" font-size="12" fill="#166534" font-style="italic">writes into the original</text>

  <path d="M 960 390 C 1000 300, 950 200, 660 165" fill="none" stroke="#15803d" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
  <text x="960" y="230" text-anchor="middle" font-size="11" fill="#166534" font-style="italic">mutates original</text>
  <text x="960" y="246" text-anchor="middle" font-size="11" fill="#166534" font-style="italic">Age → 29</text>
</svg>
